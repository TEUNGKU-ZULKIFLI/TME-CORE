name: NDLC Phase Task
description: Buat issue terstruktur berbasis fase NDLC
title: "[NDLC][PHASE-X] <judul tugas>"
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Gunakan template ini agar setiap issue punya scope, metrik, dan acceptance criteria yang jelas.

  - type: dropdown
    id: phase
    attributes:
      label: Phase NDLC
      options:
        - Analysis
        - Design
        - Simulation
        - Implementation
        - Monitoring
        - Management
    validations:
      required: true

  - type: input
    id: objective
    attributes:
      label: Objective
      description: Tujuan utama issue ini
      placeholder: Contoh: Menetapkan baseline latensi dan packet loss sebelum serangan
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope In / Out
      description: Jelaskan batasan pekerjaan
      value: |
        In Scope:
        -

        Out of Scope:
        -
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Spesifikasi lab atau perangkat yang dipakai
      value: |
        Router:
        - Model:
        - RouterOS:

        Controller:
        - OS:
        - Python:

        Traffic Source:
        - OS/tool:

  - type: textarea
    id: dataset
    attributes:
      label: Data yang Harus Dikumpulkan
      value: |
        - Baseline latency (ms)
        - Packet loss (%)
        - Throughput (Mbps)
        - CPU router (% avg, p95)
        - Event timestamps (detect, block, notify)
        - Raw log snippets (SSH/FTP)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] Semua metrik terkumpul dengan format konsisten
        - [ ] Bukti mentah tersedia (log/csv/screenshot)
        - [ ] Analisis ringkas + kesimpulan
        - [ ] Risiko dan asumsi didokumentasikan
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      value: |
        - docs/<nama-file>.md
        - data/<nama-file>.csv (opsional)
        - update issue parent #1
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks & Mitigation
      placeholder: Contoh: WSL tidak bisa jangkau router fisik -> gunakan host Windows bridge / port-forward

  - type: checkboxes
    id: compliance
    attributes:
      label: Safety & Compliance
      options:
        - label: Pengujian dilakukan hanya di lab/lingkungan berizin
          required: true
        - label: Tidak menguji target publik/produksi tanpa persetujuan tertulis
          required: true
